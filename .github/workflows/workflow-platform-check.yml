name: Workflow Platform Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-platform-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: 1.26.2
          cache: false

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Validate organization default files
        shell: bash
        run: |
          git ls-files --error-unmatch README.md profile/README.md .github/CODEOWNERS \
            .github/dependabot.yml PULL_REQUEST_TEMPLATE.md SECURITY.md CONTRIBUTING.md \
            SUPPORT.md docs/REPOSITORY_STANDARDS.md >/dev/null

      - name: Lint repository workflows
        shell: bash
        run: actionlint

      - name: Lint workflow templates
        shell: bash
        run: |
          set -euo pipefail
          actionlint workflow-templates/*.yml

      - name: Validate workflow template metadata
        shell: bash
        run: |
          set -euo pipefail
          for file in workflow-templates/*.properties.json; do
            jq empty "$file"
          done

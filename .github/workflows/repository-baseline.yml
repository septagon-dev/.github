name: Repository Baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    uses: septagon-dev/actions/.github/workflows/reusable-repository-baseline.yml@76726702fe8c06559734b68285ff8566b5903782
    with:
      required_paths: |
        README.md
        profile/README.md
        .github/CODEOWNERS
        .github/dependabot.yml
        PULL_REQUEST_TEMPLATE.md
        SECURITY.md
        CONTRIBUTING.md
        SUPPORT.md
        docs/REPOSITORY_STANDARDS.md
